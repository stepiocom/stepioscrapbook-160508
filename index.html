<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client Portal</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .post-item { border-bottom: 1px solid #ccc; padding: 15px 0; }
    </style>
</head>
<body>

    <div id="login-screen">
        <input type="password" id="password-input" placeholder="Enter Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <div id="content-screen" style="display:none;">
        <h1>Your Updates</h1>
        <div id="post-container">Loading...</div>
    </div>

    <script>
        const CORRECT_PASSWORD = "123456789";

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === CORRECT_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content-screen').style.display = 'block';
                loadAndDisplay();
            } else {
                alert("Incorrect Password");
            }
        }

        async function loadAndDisplay() {
            try {
                // Using jsDelivr as it is the most reliable way to get raw data
                const url = 'https://cdn.jsdelivr.net/gh/stepiocom/stepioscrapbook-160508@main/data.js?t=' + Date.now();
                const response = await fetch(url, { cache: "no-store" });
                const text = await response.text();
                
                // Find where the array starts and ends
                const start = text.indexOf('[');
                const end = text.lastIndexOf(']');

                if (start === -1 || end === -1) {
                    throw new Error("Data format error. Start: " + start + ", End: " + end);
                }

                // Slice out the pure array string
                const jsonString = text.substring(start, end + 1);
                const data = JSON.parse(jsonString);
                
                renderData(data);
            } catch (e) {
                document.getElementById('post-container').innerText = "Error loading: " + e.message;
                console.error("DEBUG:", e);
            }
        }

        function renderData(data) {
            const container = document.getElementById('post-container');
            container.innerHTML = ''; 

            // Ensure data is an array
            if (!Array.isArray(data)) data = [];

            data.sort((a, b) => b.id - a.id).forEach(item => {
                const date = new Date(item.id).toLocaleDateString();
                container.innerHTML += `
                    <div class="post-item">
                        <h3>${item.title.en} (${date})</h3>
                        <p>${item.payload}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
