<!DOCTYPE html>
<html>
<body>
    <input type="password" id="pass" placeholder="Password"><button onclick="show()">Enter</button>
    <div id="view"></div>
    <script src="data.js"></script>
    <script>
        function show() {
            if(document.getElementById('pass').value !== "123456789") return alert("Wrong");
            clientWorkspaceData.forEach(a => {
                document.getElementById('view').innerHTML += `<h3>[${a.type}] ${a.title.en}</h3><p>${a.payload}</p><hr>`;
            });
        }
    </script>
</body>
</html>
