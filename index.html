<!DOCTYPE html>
<html>
<head>
    <title>Client Portal</title>
</head>
<body>

    <div id="login-screen">
        <input type="password" id="password-input" placeholder="Enter Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <div id="content-screen" style="display:none;">
        <h1>Your Updates</h1>
        <div id="post-container">Loading data...</div>
    </div>

    <script>
        // REPLACE with your actual password
        const CORRECT_PASSWORD = "your_secret_password_here";

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === CORRECT_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content-screen').style.display = 'block';
                loadAndDisplay();
            } else {
                alert("Incorrect Password");
            }
        }

        async function loadAndDisplay() {
            try {
                // Using a timestamp '?t=' forces the browser to ignore old cache
                const url = 'https://raw.githubusercontent.com/stepiocom/stepioscrapbook-160508/main/data.js?t=' + Date.now();
                const response = await fetch(url);
                const text = await response.text();
                
                // Extract only the JSON array part
                const jsonString = text.substring(text.indexOf('['), text.lastIndexOf(']') + 1);
                const data = JSON.parse(jsonString);
                
                const container = document.getElementById('post-container');
                container.innerHTML = ''; 

                // Sort by ID (newest first)
                data.sort((a, b) => b.id - a.id).forEach(item => {
                    const date = new Date(item.id).toLocaleDateString();
                    container.innerHTML += `
                        <div style="border-bottom: 1px solid #ccc; padding: 10px 0;">
                            <h3>${item.title.en} (${date})</h3>
                            <p>${item.payload}</p>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('post-container').innerText = "Error loading content: " + e.message;
            }
        }
    </script>
</body>
</html>
