<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal</title>
    <link rel="icon" href="29083386.png" type="image/png">
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 800px; margin: auto; }
        .post-item { border-bottom: 1px solid #ccc; padding: 20px 0; margin-bottom: 10px; }
        .post-content { white-space: pre-wrap; margin-top: 10px; }
        .tag { font-size: 0.8em; background: #eee; padding: 2px 6px; border-radius: 4px; color: #555; text-transform: uppercase; }
        #client-header { font-weight: bold; color: #333; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <input type="password" id="password-input" placeholder="Enter Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <div id="content-screen" style="display:none;">
        <div id="client-header">Client ID: 160508</div>
        <h1>Your Updates</h1>
        <div id="post-container">Loading...</div>
    </div>

    <script>
        const CORRECT_PASSWORD = "123456789";

        function checkPassword() {
            if (document.getElementById('password-input').value === CORRECT_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content-screen').style.display = 'block';
                loadAndDisplay();
            } else { alert("Incorrect Password"); }
        }

        async function loadAndDisplay() {
            try {
                const url = 'https://cdn.jsdelivr.net/gh/stepiocom/stepioscrapbook-160508@main/data.js?t=' + Date.now();
                const response = await fetch(url, { cache: "no-store" });
                const text = await response.text();
                const start = text.indexOf('[');
                const end = text.lastIndexOf(']');
                const data = JSON.parse(text.substring(start, end + 1));
                
                const container = document.getElementById('post-container');
                container.innerHTML = ''; 
                data.sort((a, b) => b.id - a.id).forEach(item => {
                    container.innerHTML += `
                        <div class="post-item">
                            <span class="tag">${item.type}</span>
                            <h3>${item.title.en} (${new Date(item.id).toLocaleDateString()})</h3>
                            <div class="post-content">${item.payload}</div>
                        </div>
                    `;
                });
            } catch (e) { document.getElementById('post-container').innerText = "Error loading content."; }
        }
    </script>
</body>
</html>
