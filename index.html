<!DOCTYPE html>
<html>
<head><title>Scrapbook</title></head>
<body>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="unlock()">Enter</button>
    <div id="view"></div>
    <script src="data.js"></script>
    <script>
        function unlock() {
            if(document.getElementById('pass').value !== "YOUR_SECRET_PASSWORD") return alert("Wrong");
            const view = document.getElementById('view');
            view.innerHTML = "";
            clientWorkspaceData.forEach(item => {
                view.innerHTML += `<div><h3>[${item.type}] ${item.title.en}</h3><p>${item.payload}</p><hr></div>`;
            });
        }
    </script>
</body>
</html>
