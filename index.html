<!DOCTYPE html>
<html>
<head>
    <title>SCRAPBOOK</title>
</head>
<body>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="unlock()">Enter</button>
    <div id="view"></div>

    <script src="data.js"></script>
    <script>
        function unlock() {
            // Edit this password inside your GitHub file
            if(document.getElementById('pass').value !== "123456789") {
                return alert("Wrong Password");
            }
            
            const view = document.getElementById('view');
            view.innerHTML = "";
            
            clientWorkspaceData.forEach(item => {
                view.innerHTML += `
                    <div style="border-bottom:1px solid #ccc; padding:10px;">
                        <h3>[${item.type}] ${item.title.en}</h3>
                        <p>${item.payload}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
